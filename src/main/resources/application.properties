spring.application.name=ecommerce-platform

# PostgreSQL接続設定（アプリケーションロール使用）
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db?currentSchema=ecommerce
spring.datasource.username=ecommerce_app
spring.datasource.password=app_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=ecommerce
