spring:
  application:
    name: ecommerce-platform

  # ファイルアップロード設定
  servlet:
    multipart:
      max-file-size: 30MB      # フルサイズミラーレスカメラのJPEG高画質に対応
      max-request-size: 350MB  # 10枚同時アップロード想定（30MB × 10枚 + マージン）
      enabled: true

  # PostgreSQL接続設定（アプリケーションロール使用）
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db?currentSchema=ecommerce
    username: ecommerce_app
    password: app_password
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate設定
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        default-schema: ecommerce

app:
  file:
    upload:
      dir: /Users/kawasakitakumi/server