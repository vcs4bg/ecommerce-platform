<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: common_head('商品詳細')}"></head>

<body>
	<nav th:replace="~{layout/layout :: common_nav}"></nav>

	<div class="container mt-5">
		<h1 class="mb-4">商品詳細</h1>
		<div class="card">
			<div class="card-body">
				<div class="mb-3">
					<label class="form-label fw-bold">商品ID</label>
					<p class="form-control-plaintext" th:text="${product?.productId}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">商品名</label>
					<p class="form-control-plaintext" th:text="${product?.productName}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">商品説明</label>
					<p class="form-control-plaintext" th:text="${product?.description}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">価格</label>
					<p class="form-control-plaintext" th:text="${#numbers.formatCurrency(product?.price)}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">商品画像</label>
					<div th:if="${product?.imageUrl}">
						<img th:src="${product.imageUrl}" alt="商品画像" class="img-thumbnail" style="max-width: 300px;">
					</div>
					<p class="form-control-plaintext" th:if="!${product?.imageUrl}">画像なし</p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">在庫数</label>
					<p class="form-control-plaintext" th:text="${product?.stock}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">カテゴリID</label>
					<p class="form-control-plaintext" th:text="${product?.categoryId}"></p>
				</div>
				<div class="mb-3">
					<label class="form-label fw-bold">商品ステータス</label>
					<p class="form-control-plaintext"
						th:text="${product?.productStatus == 1} ? '表示' : ${product?.productStatus == 0} ? '非表示' : '販売終了'">
					</p>
				</div>
				<div class="d-flex justify-content-end gap-2">
					<a th:href="@{/products/list}" class="btn btn-secondary">一覧に戻る</a>
					<a th:href="@{/products/admin/edit(id=${product?.productId})}" class="btn btn-primary">編集</a>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{layout/layout :: common_scripts}"></th:block>
</body>

</html>
