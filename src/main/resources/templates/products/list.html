<!-- layout.htmlのmainフラグメントを利用 -->
<div layout:decorate="~{layout/layout}">
    <div layout:fragment="content">
        <h1 class="mb-4">商品一覧</h1>
        <div class="mb-4 d-flex">
            <a th:href="@{/products/edit}" class="btn btn-success">新規作成</a>
        </div>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- 商品リストをループ表示（サンプル構造） -->
            <div class="col" th:each="product : ${products}">
                <div class="card h-100">
                    <img th:src="${product.imageUrl}" class="card-img-top" alt="商品画像" style="object-fit:cover; height:200px;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">商品名</h5>
                        <p class="card-text" th:text="${product.description}">商品の説明が入ります。</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + '円'}">1,000円</span>
                        <a th:href="@{'/products/detail/' + ${product.id}}" class="btn btn-outline-primary btn-sm">詳細</a>
                    </div>
                </div>
            </div>
            <!-- /商品リスト -->
        </div>
    </div>
</div>
