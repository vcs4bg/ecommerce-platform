<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: common_head('エラー')}" />

<body>
    <nav th:replace="~{layout/layout :: common_nav}"></nav>

    <div class="container mt-5">
        <div class="alert alert-danger" role="alert">
            <h1 class="h4 mb-3">エラーが発生しました</h1>
            <p class="mb-0" th:text="${errorMessage}">予期しないエラーが発生しました。</p>
        </div>
        <a th:href="@{/}" class="btn btn-primary">ホームへ戻る</a>
    </div>

    <th:block th:replace="~{layout/layout :: common_scripts}"></th:block>
</body>

</html>
