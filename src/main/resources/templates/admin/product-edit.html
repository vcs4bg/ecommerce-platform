<div layout:decorate="~{layout/layout}">
	<div layout:fragment="content">
		<h1 class="mb-4" th:text="${isCreate} ? '商品新規作成' : '商品編集'">商品編集</h1>
		<form th:action="@{/admin/product-regist}" method="post" enctype="multipart/form-data">
			<input type="hidden" name="productId" th:value="${product?.productId}" />
			<div class="mb-3">
				<label for="productName" class="form-label">商品名</label>
				<input type="text" class="form-control" id="productName" name="productName" th:value="${product?.productName}" required maxlength="100">
			</div>
			<div class="mb-3">
				<label for="description" class="form-label">商品説明</label>
				<textarea class="form-control" id="description" name="description" rows="3" th:text="${product?.description}"></textarea>
			</div>
			<div class="mb-3">
				<label for="price" class="form-label">価格</label>
				<input type="number" class="form-control" id="price" name="price" th:value="${product?.price}" required min="0" step="0.01">
			</div>
			<div class="mb-3">
				<label for="imageFile" class="form-label">商品画像</label>
				<input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
				<div th:if="${product?.imageUrl}">
					<img th:src="${product.imageUrl}" alt="商品画像" class="img-thumbnail mt-2" style="max-width: 200px;">
				</div>
			</div>
			<div class="mb-3">
				<label for="stock" class="form-label">在庫数</label>
				<input type="number" class="form-control" id="stock" name="stock" th:value="${product?.stock}" required min="0">
			</div>
			<div class="mb-3">
				<label for="categoryId" class="form-label">カテゴリID</label>
				<input type="number" class="form-control" id="categoryId" name="categoryId" th:value="${product?.categoryId}">
			</div>
			<div class="mb-3">
				<label for="productStatus" class="form-label">商品ステータス</label>
				<select class="form-select" id="productStatus" name="productStatus" th:value="${product?.productStatus}">
					<option value="1">表示</option>
					<option value="0">非表示</option>
					<option value="2">販売終了</option>
				</select>
			</div>
			<div class="d-flex justify-content-end">
				<button type="submit" class="btn btn-primary">保存</button>
			</div>
		</form>
	</div>
</div>
